name: Build Stage4 Episode 17.2

on:
  push:
    branches: [main]
    paths:
      - 'tools/ep172_pipeline.py'
      - '.github/workflows/build-stage4-ep172.yml'
      - 'translation_cache/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Checkout pinned rAthena
        shell: bash
        run: |
          rm -rf upstream
          git clone --filter=blob:none https://github.com/rathena/rathena.git upstream
          cd upstream
          git checkout e985006171d2eb320ee512a653f4c83aea3d81b6
          test "$(git rev-parse HEAD)" = "e985006171d2eb320ee512a653f4c83aea3d81b6"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install translation dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install 'transformers<5' sentencepiece sacremoses
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build Episode 17.2 PT-BR stage
        shell: bash
        run: |
          rm -rf NEW_STAGE_4_EP17_2
          python tools/ep172_pipeline.py upstream NEW_STAGE_4_EP17_2 | tee ep172_build_summary.json

      - name: Preserve first-pass audit and generated stage
        shell: bash
        run: |
          git config user.name "Nova Era Stage Builder"
          git config user.email "actions@users.noreply.github.com"
          git add NEW_STAGE_4_EP17_2 translation_cache ep172_build_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Build EP17.2 PT-BR first-pass [skip ci]"
            git push
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEW_STAGE_4_EP17_2_FIRST_PASS
          path: |
            NEW_STAGE_4_EP17_2
            ep172_build_summary.json
          if-no-files-found: error
          retention-days: 7
